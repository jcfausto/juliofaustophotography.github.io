<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  {% if page.noindex or page.layout == '404' %}
    <meta name="robots" content="noindex, follow, noai, noimageai">
  {% else %}
    <meta name="robots" content="index, follow, noai, noimageai">
  {% endif %}
  {% seo %}
  {% for profile in site.social.links %}
    <link rel="me" href="{{ profile }}">
  {% endfor %}
  <link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16x16.png' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/site.webmanifest' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }} — Field Notes" href="{{ '/rss.xml' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} — Field Notes" href="{{ '/field-notes/atom.xml' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} — Essays" href="{{ '/essays/atom.xml' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/space-grotesk-normal-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/source-serif-4-normal-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {%- if jekyll.environment == "production" and site.cloudflare_analytics_token %}
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{ site.cloudflare_analytics_token }}"}'></script>
  {%- endif %}
</head>
