<dialog class="lightbox" id="lightbox" aria-label="Photograph viewer">
  <figure class="lightbox-figure">
    <img id="lightboxImg" alt="" decoding="async" data-proofer-ignore>
    <figcaption id="lightboxCaption"></figcaption>
  </figure>
  <div class="lightbox-controls">
    <button class="lightbox-btn" id="lightboxPrev" type="button" aria-label="Previous photograph">←</button>
    <span class="lightbox-count" id="lightboxCount" aria-live="polite"></span>
    <button class="lightbox-btn" id="lightboxNext" type="button" aria-label="Next photograph">→</button>
  </div>
  <button class="lightbox-btn lightbox-close" id="lightboxClose" type="button">Close ✕</button>
</dialog>
