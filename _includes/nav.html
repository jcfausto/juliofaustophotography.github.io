<nav class="site-nav" aria-label="Main">
  <a class="mark" href="{{ '/' | relative_url }}" aria-label="{{ site.data.site.nav_mark }} {{ site.data.site.nav_descriptor }} — home">
    <span class="dot" aria-hidden="true"></span>
    <span class="mark-name">{{ site.data.site.nav_mark }}</span>
    <span class="mark-descriptor">{{ site.data.site.nav_descriptor }}</span>
  </a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navlinks" aria-label="Open menu">
    <span></span><span></span>
  </button>
  <div class="navlinks" id="navlinks">
    {% for item in site.data.site.nav %}
      {% assign active = false %}
      {% if item.layouts contains page.layout %}{% assign active = true %}{% endif %}
      <a href="{{ item.url | relative_url }}" class="navlink{% if active %} active{% endif %}"{% if active %} aria-current="page"{% endif %}>{{ item.label }}</a>
    {% endfor %}
  </div>
</nav>
