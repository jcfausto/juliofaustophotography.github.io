# Copy and sizes for /prints/. Which photos are printable is set in
# _data/photos.yml:
#
#   - src: /assets/images/photography/…/photo.jpg
#     alt: "…"
#     caption: "Tuscany, Italy"
#     collection: woodlands-and-landscapes
#     print:
#       id: tuscany-hills        # required, unique; used in /prints/#id and emails
#       title: "Morning hills"   # optional, defaults to the caption
#       sizes:                   # optional, replaces the standard sizes below
#         - label: "30 × 45 cm"
#           price: "€ 90"
#
# Printable photos appear in the order they have in photos.yml. The frame shows
# `default` first, unless the URL names another (/prints/#id).

default: early-morning-tuscany-hills

# Standard sizes, grouped by aspect ratio (long side ÷ short side). Each photo
# is offered the group closest to its own ratio; portrait photos get the same
# sizes upright. `price` is optional; without prices the page says
# "Prices on request". The first size is preselected.
size_sets:
  - name: "3:2"
    ratio: 1.5
    sizes:
      - label: "20 × 30 cm"
      - label: "30 × 45 cm"
      - label: "40 × 60 cm"
  - name: "4:3"
    ratio: 1.333
    sizes:
      - label: "30 × 40 cm"
      - label: "45 × 60 cm"
      - label: "60 × 80 cm"
  - name: "16:9"
    ratio: 1.778
    sizes:
      - label: "25 × 45 cm"
      - label: "34 × 60 cm"
      - label: "45 × 80 cm"

